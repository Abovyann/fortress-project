---
- name: 
  hosts: db_primary
  become: yes

  tasks:
    - name: "Install unzip (required for AWS CLI)"
      apt:
        name: unzip
        state: present

    - name: "Download and extract AWS CLI v2"
      unarchive:
        src: "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip"
        dest: "/tmp"
        remote_src: yes

    - name: "Run the AWS CLI installer"
      command: /tmp/aws/install --update

    - name: "Download and extract AWS CLI v2"
      unarchive:
        src: "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip"
        dest: "/tmp"
        remote_src: yes

    - name: "Run the AWS CLI installer"
      command: /tmp/aws/install --update

    - name: "Create a directory for scripts"
      file:
        path: /opt/scripts
        state: directory

    - name: "Copy the script to the server"
      copy:
        src: files/backup.sh
        dest: /opt/scripts/backup.sh
        mode: '0755'

    - name: "Schedule the Cron Job"
      cron:
        name: "Nightly Postgres S3 backup"
        minute: "0"
        hour: "2"
        job: "/opt/scripts/backup.sh"
        user: root