---
- name: "Configure HAProxy Load Balancer"
  hosts: loadbalancers
  become: yes

  tasks:
    - name: "Install HAProxy"
      apt:
        name: haproxy 
        state: present

    - name: "Push dynamic config file"
      template:
        src: templates/haproxy.cfg.j2
        dest: /etc/haproxy/haproxy.cfg
        mode: '0644'
      notify: "Restart HAProxy" 

    - name: "Ensure HAProxy is enabled on boot"
      systemd:
        name: haproxy
        state: started 

  handlers:
    - name: "Restart HAProxy"
      systemd:
        name: haproxy
        state: restarted