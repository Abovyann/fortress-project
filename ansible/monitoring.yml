---
- name: Monitoring Tools Install
  hosts: loadbalancers
  become: true

  tasks:
    - name: Install Prometheus
      apt:
        name: prometheus
        state: present

    - name: Install Grafana using direct link
      apt:
        deb: "https://dl.grafana.com/oss/release/grafana_10.4.1_amd64.deb"

    - name: Push the Prometheus Config
      template: 
        src: templates/prometheus.yml.j2
        dest: /etc/prometheus/prometheus.yml
      notify: "Restart Prometheus"

    - name: "Enable Prometheus and Grafana on boot"
      systemd:
        name: "{{ item }}"
        state: started
        enabled: yes
      loop:
        - prometheus
        - grafana-server

    - name: "Open UFW for Grafana"
      ufw:
        rule: allow
        port: '3000'
        proto: tcp

  handlers:
    - name: "Restart Prometheus"
      systemd:
        name: prometheus
        state: restarted