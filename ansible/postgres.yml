---
- name: "Install PostgreSQL Packages"
  hosts: databases
  become: yes

  tasks:
    - name: Install PostgreSQL
      apt:
        name: [postgresql, postgresql-contrib, python3-psycopg2, acl]
        state: present

    - name: Ensure PostgreSQL service is running
      systemd:
        name: postgresql
        state: started
        enabled: yes

    - name: "Allow PostgreSQL through UFW"
      ufw:
        rule: allow
        port: '5432'
        proto: tcp


- name: "Configure primary database"
  hosts: db_primary
  become: yes
  vars_files:
    - secrets.yml

  tasks:
    - name: "Create replication user"
      postgresql_user:
        name: replicator
        password: "{{ db_password }}"
        role_attr_flags: REPLICATION
      become_user: postgres

    - name: "Configure postgres to listen on all internal IPs"
      lineinfile:
        path: /etc/postgresql/16/main/postgresql.conf
        regexp: "^#?listen_addresses"
        line: "listen_addresses = '*'"
      notify: "Restart Postgres"

    - name: "Allow replica's IP to connect in pg_hba.conf"
      lineinfile: 
        path: /etc/postgresql/16/main/pg_hba.conf
        line: "host replication replicator {{ hostvars['db_replica']['ansible_host'] }}/32 scram-sha-256"
      notify: "Restart Postgres"

  handlers:
    - name: "Restart Postgres"
      systemd:
        name: postgresql
        state: restarted



- name: "Configure Replica Database"
  hosts: db_replica
  become: yes
  vars_files:
    - secrets.yml

  tasks:
    - name: "Stop PostgreSQL on Replica before cloning"
      systemd:
        name: postgresql
        state: stopped

    - name: "Clear the default data directory"
      file:
        path: /var/lib/postgresql/16/main/
        state: absent

    - name: "Clone the Primary database using pg_basebackup"
      command: >
        pg_basebackup -h {{ hostvars['db_primary']['ansible_host'] }} 
        -D /var/lib/postgresql/16/main/ 
        -U replicator 
        -v -P -X stream -R
      become_user: postgres
      environment:
        PGPASSWORD: "{{ db_password }}"

    - name: "Ensure correct permissions on data directory"
      file:
        path: /var/lib/postgresql/16/main/
        state: directory
        owner: postgres
        group: postgres
        mode: '0700'

    - name: "Start PostgreSQL on Replica"
      systemd:
        name: postgresql
        state: started