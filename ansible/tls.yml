---
- name: "Configure TLS/SSL Certificates"
  hosts: loadbalancers
  become: yes
  vars:
    domain_name: "{{ ansible_host }}.nip.io"
    letsencrypt_email: "abovyan.narek.03@gmail.com"  # <--- CHANGE THIS

  tasks:
    - name: "Install Certbot"
      apt:
        name: certbot
        state: present

    - name: "Create HAProxy certs directory"
      file:
        path: /etc/haproxy/certs
        state: directory
        mode: '0755'

    - name: "Obtain Let's Encrypt Certificate"
      command: >
        certbot certonly --standalone --non-interactive --agree-tos
        --email {{ letsencrypt_email }} 
        -d {{ domain_name }} 
        --pre-hook "systemctl stop haproxy" 
        --post-hook "systemctl start haproxy"
      args:
        creates: "/etc/letsencrypt/live/{{ domain_name }}/fullchain.pem"

    - name: "Combine certificate and key for HAProxy"
      shell: "cat /etc/letsencrypt/live/{{ domain_name }}/fullchain.pem /etc/letsencrypt/live/{{ domain_name }}/privkey.pem > /etc/haproxy/certs/{{ domain_name }}.pem"
      args:
        creates: "/etc/haproxy/certs/{{ domain_name }}.pem"