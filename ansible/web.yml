---
- name: Deploy web servers
  hosts: webservers
  become: yes

  tasks:
  - name: Install Docker
    apt:
      name: [docker.io, python3-docker]
      state: present

  - name: Ensure Docker service is running
    systemd:
      name: docker
      state: started
      enabled: yes

  - name: Add ubuntu user to docker group
    user:
      name: ubuntu
      groups: docker
      append: yes

  - name: Run Nginx container
    docker_container:
      name: webapp
      image: nginx:latest
      restart_policy: always
      ports: ["80:80"]

  - name: "Allow HTTP through UFW for HAProxy"
    ufw:
      rule: allow
      port: 80
      proto: tcp
      